nodeLinker: hoisted
minimumReleaseAge: 1440 # 1 day

# Security fixes from `pnpm audit` (overrides must live here in pnpm 10+)
overrides:
  shell-quote: ^1.12.0
  form-data: ^4.0.6
  undici: ^6.29.1
  tar: ^7.5.21
  nanoid: ^3.3.18
  fast-uri: ^3.1.9
  js-yaml@^3.0.0: ^3.15.1
  js-yaml@^4.0.0: ^4.3.1
  '@babel/core@^7.0.0': ^7.29.1
  postcss: ^8.5.23
  source-map-js: ^1.2.2
  compression: ^1.8.2
  brace-expansion@^1.0.0: ^1.1.21
  brace-expansion@^2.0.0: ^2.1.7
  brace-expansion@^5.0.0: ^5.0.12
  node-forge: ^1.4.1
  jsondiffpatch: ^0.7.6
  'glob@>=9.0.0 <=14.0.1': ^14.0.2
  'minimatch@>=7.0.0 <11.0.1': ^11.0.1
  # image-size: must remain on ^1.x because metro@0.83 passes file path strings to imageSize(), which v2+ dropped
  uuid: ^11.1.1

allowBuilds:
  '@parcel/watcher': false
  unrs-resolver: true

auditConfig:
  # GHSA-gcqx-w48m-w2h4: deepmerge <=4.3.1 (low, dev/test-only via jest-config): no patched version published upstream
  # GHSA-866g-f22w-33x8 & GHSA-rwvc-j5jr-mgvh: @ai-sdk/provider-utils 3.0.28+ uses dynamic `import(id)` for Node.js modules, which breaks React Native Metro bundler; not applicable here since the app only sends text prompts
  # GHSA-mrhx-c7xc-m3w5: zod v3 is required by ai@4.x (zod v4 changes internal APIs); app does not validate untrusted user-supplied schemas with constrained collections
  ignoreGhsas:
    - GHSA-gcqx-w48m-w2h4
    - GHSA-866g-f22w-33x8
    - GHSA-rwvc-j5jr-mgvh
    - GHSA-mrhx-c7xc-m3w5
