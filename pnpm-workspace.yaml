  nanoid: ^3.3.18
  fast-uri: ^3.1.3
  js-yaml@^3.0.0: ^3.15.1
  js-yaml@^4.0.0: ^4.3.1
  '@babel/core@^7.0.0': ^7.29.1
  postcss: ^8.5.23
